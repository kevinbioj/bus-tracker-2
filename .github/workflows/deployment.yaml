name: Deployment

on:
  push:
    branches: ['main']
    paths:
      - apps/client/**/*
      - apps/server/**/*
      - providers/**/*
      - '!providers/*/configurations/**'
      - docker/**/*
      - libraries/**/*
      - scripts/**/*
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .dockerignore
      - .github/workflows/deployment.yaml

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    # Determine which images the push actually affects: a change confined to one
    # provider must not rebuild the other seven, nor redeploy the stack.
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      components: ${{ steps.filter.outputs.components }}
      deploy: ${{ steps.filter.outputs.deploy }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Compute affected components
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          all='client server flowly gtfs hawk idelis rtm twisto'
          providers='flowly gtfs hawk idelis rtm twisto'
          selected=''

          add() {
            for component in $1; do
              case " ${selected} " in
                *" ${component} "*) ;;
                *) selected="${selected} ${component}" ;;
              esac
            done
          }

          # A force push (or a first push) leaves us without a usable base: rebuild everything.
          if [ -z "${BEFORE}" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No usable base commit, falling back to a full build."
            add "${all}"
          else
            files="$(git diff --name-only "${BEFORE}" "${AFTER}")"
            echo "Changed files:"
            echo "${files}"

            while IFS= read -r file; do
              [ -n "${file}" ] || continue
              case "${file}" in
                apps/client/*)                                  add 'client' ;;
                apps/server/*)                                  add 'server' ;;
                docker/Dockerfile-client | docker/nginx.conf)    add 'client' ;;
                docker/Dockerfile-server)                        add 'server' ;;
                # The stack pins images by commit SHA, so a deployment needs both
                # of them built for the current SHA even if only the stack changed.
                docker/*)                                        add 'client server' ;;
                scripts/*)                                       add 'client server' ;;
                libraries/contracts/*)                           add "${all}" ;;
                libraries/monitoring/* | libraries/redis/*)      add "server ${providers}" ;;
                # Configurations are mounted at runtime, they never enter an image.
                providers/*/configurations/*)                   ;;
                providers/*)                                     add "$(echo "${file}" | cut -d/ -f2)" ;;
                package.json | pnpm-lock.yaml | pnpm-workspace.yaml | .dockerignore | .github/workflows/deployment.yaml)
                                                                 add "${all}" ;;
              esac
            done <<< "${files}"
          fi

          # The stack pins both client and server on the pushed SHA, so deploying
          # requires both images to exist for it: pull one in, pull the other too.
          case " ${selected} " in
            *' client '* | *' server '*) add 'client server' ;;
          esac

          if [ -z "${selected# }" ]; then
            components='[]'
          else
            components="$(printf '%s\n' ${selected} | jq -Rc . | jq -sc .)"
          fi
          echo "Components to build: ${components}"
          echo "components=${components}" >> "$GITHUB_OUTPUT"

          # Only client and server live in the stack: nothing else is worth a deployment.
          case " ${selected} " in
            *' client '* | *' server '*) deploy='true' ;;
            *)                           deploy='false' ;;
          esac
          echo "Deploy the stack: ${deploy}"
          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"

  build:
    # Every image is built on a runner of its own architecture.
    runs-on: ${{ matrix.runner }}
    needs: ['changes']
    if: needs.changes.outputs.components != '[]'

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
        platform: ['linux/amd64', 'linux/arm64']
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Copy environment files
        run: |
          echo "${{ secrets.CLIENT_ENV }}" > apps/client/.env
          echo "${{ secrets.SERVER_ENV }}" > apps/server/.env

      - name: Prepare build variables
        run: |
          # Applications live at <repo>/<name>, providers at <repo>/provider/<name>.
          case "${{ matrix.component }}" in
            client | server)
              image="${{ matrix.component }}"
              dockerfile="docker/Dockerfile-${{ matrix.component }}"
              ;;
            *)
              image="provider/${{ matrix.component }}"
              dockerfile="providers/${{ matrix.component }}/Dockerfile"
              ;;
          esac

          platform="${{ matrix.platform }}"

          # GHCR rejects uppercase, and this repository owner has some.
          {
            echo "IMAGE_PATH=${image}"
            echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}/${image}"
            echo "DOCKERFILE=${dockerfile}"
            echo "PLATFORM_PAIR=${platform//\//-}"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_PATH }}
          tags: type=sha,format=long

      - name: Generate build information
        id: build-info
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_time=$(date +'%Y-%m-%dT%H:%M:%S%:z')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          cache-from: type=gha,scope=${{ matrix.component }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ env.PLATFORM_PAIR }}
          build-args: |
            BUILD_HASH=${{ steps.build-info.outputs.short_sha }}
            BUILD_TIMESTAMP=${{ steps.build-info.outputs.build_time }}
          secrets: |
            posthog_cli_api_key=${{ secrets.POSTHOG_CLI_API_KEY }}
            posthog_cli_project_id=${{ secrets.POSTHOG_CLI_PROJECT_ID }}
            posthog_cli_host=${{ secrets.POSTHOG_CLI_HOST }}
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: digests-${{ matrix.component }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # Combine the per-platform images pushed above into one multi-arch manifest
    # list carrying the tags consumers actually pull.
    runs-on: ubuntu-latest
    needs: ['changes', 'build']

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}

    steps:
      - name: Prepare image name
        run: |
          case "${{ matrix.component }}" in
            client | server) image="${{ matrix.component }}" ;;
            *)               image="provider/${{ matrix.component }}" ;;
          esac

          {
            echo "IMAGE_PATH=${image}"
            echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}/${image}"
          } >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.component }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_PATH }}
          tags: type=sha,format=long

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"

  deploy:
    runs-on: ubuntu-latest
    needs: ['changes', 'merge']
    if: needs.changes.outputs.deploy == 'true'

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Deploy stack to the server
        uses: kitconcept/docker-stack-deploy@97ba9a7dd7782cf178b42aa6466a95b99216b313
        env:
          deploy_ssh_host: ${{ secrets.DEPLOY_SSH_HOST }}
          deploy_ssh_port: ${{ secrets.DEPLOY_SSH_PORT }}
          deploy_ssh_user: ${{ secrets.DEPLOY_SSH_USER }}
          deploy_ssh_private_key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        if: ${{ env.deploy_ssh_host != '' && env.deploy_ssh_port != '' && env.deploy_ssh_user != '' && env.deploy_ssh_private_key != '' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          remote_host: ${{ secrets.DEPLOY_SSH_HOST }}
          remote_port: ${{ secrets.DEPLOY_SSH_PORT }}
          remote_user: ${{ secrets.DEPLOY_SSH_USER }}
          remote_private_key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          stack_file: "docker/bus-tracker-stack.yaml"
          stack_name: "bus-tracker"
