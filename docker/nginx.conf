worker_processes 1;
pid /tmp/nginx.pid;

events {
    accept_mutex on;
}

http {
    include mime.types;

    types {
        application/manifest+json  webmanifest;
    }

    server {
        listen       3000;
        server_name  localhost;

        access_log off;
        error_log off;

        root        /usr/share/nginx/html;
        error_page  404 /index.html;

        location / {
            # `$request_uri` carries the query string and stays percent-encoded, so any asset
            # requested with one (`?__WB_REVISION__=`, a cache buster…) misses its file and falls
            # back to `index.html` – served as `text/html` to a caller expecting JSON.
            try_files $uri =404;

            location = /index.html {
                ssi on;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Vary Accept-Language;
            }
        }

        location = /llms.txt {
            charset utf-8;
            add_header Cache-Control "no-cache";
        }

        location ~ ^/__page-(head|body)/ {
            internal;
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $page_head_upstream server:8080;
            rewrite ^/__page-(head|body)(/.*)$ /page-$1$2 break;
            proxy_pass http://$page_head_upstream;
            proxy_set_header Accept-Encoding "";
            proxy_connect_timeout 1s;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;
        }

        location ~ ^/(|legal|attributions|data|data/(networks|vehicles)/\d+|data/lines/\d+(/.*)?|embed/\d+)/?$ {
            ssi on;
            add_header Vary Accept-Language;
            try_files /index.html =404;
        }
    }
}
