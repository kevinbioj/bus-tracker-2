<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="robots" content="index, nofollow" />

    <!-- OG Tags -->
    <meta name="title" content="Bus Tracker" />
    <meta
      name="description"
      content="Localisez vos trains, bus, tramways, métros et bateaux dans toute la France grâce à Bus Tracker"
    />
    <meta
      name="keywords"
      content="localisation, bus, métro, tramway, temps-réel, carte"
    />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png?v=2" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />

    <!-- Carte : domaines du TileJSON, des sprites, des tuiles et des glyphes -->
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="preconnect" href="https://tiles.bus-tracker.fr" crossorigin />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Bus Tracker" />
    <meta name="language" content="French" />
    <meta name="theme-color" content="#8B1A4B" />

    <!-- OpenGraph -->
    <meta property="og:title" content="Bus Tracker" />
    <meta
      property="og:image"
      content="https://bus-tracker.fr/favicon-96x96.png?v=2"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:description"
      content="Localisez vos trains, bus, tramways, métros et bateaux dans toute la France grâce à Bus Tracker"
    />
    <meta property="og:locale" content="fr" />

    <meta name="twitter:card" content="summary" />
    <meta property="twitter:title" content="Bus Tracker" />
    <meta
      property="twitter:image"
      content="https://bus-tracker.fr/favicon-96x96.png?v=2"
    />
    <meta
      property="twitter:description"
      content="Localisez vos trains, bus, tramways, métros et bateaux dans toute la France grâce à Bus Tracker"
    />
    <title>Bus Tracker</title>
    <style>
      .embed-hidden {
        display: none;
      }
    </style>
  </head>
  <body class="scheme-light-dark">
    <div id="root">
      <header
        class="bg-branding text-branding-foreground flex gap-4 h-15 p-3 sticky top-0 z-450"
        id="header"
      >
        <img class="h-full" src="/logo-header.svg?v=2" alt="" />
        <span
          class="hidden text-center font-bold text-3xl text-white lg:block select-none hover:cursor-default"
        >
          Bus Tracker
        </span>
      </header>
    </div>
    <script>
      if (location.pathname.startsWith('/embed')) {
        document.getElementById('header').classList.add("embed-hidden");
      }

      // Pages avec carte : ce que maplibre demande en cascade (style, puis TileJSON et sprite, puis
      // glyphes une fois les tuiles lues) part dès le HTML. À garder aligné sur liberty-fr.json.
      if (location.pathname === '/' || location.pathname.startsWith('/embed/')) {
        const sprite = 'https://tiles.openfreemap.org/sprites/ofm_f384/ofm' + (devicePixelRatio > 1 ? '@2x' : '');
        const glyphs = ['Noto Sans Regular', 'Noto Sans Italic', 'Noto Sans Bold'].map(
          (font) => 'https://tiles.bus-tracker.fr/fonts/' + encodeURIComponent(font) + '/0-255.pbf'
        );
        for (const href of [
          '/map-styles/liberty-fr.json',
          'https://tiles.openfreemap.org/planet',
          sprite + '.json',
          sprite + '.png',
          ...glyphs,
        ]) {
          const link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'fetch';
          link.crossOrigin = 'anonymous';
          link.href = href;
          document.head.appendChild(link);
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
