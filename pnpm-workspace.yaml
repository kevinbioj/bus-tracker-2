packages:
  - apps/client
  - apps/server
  - libraries/contracts
  - libraries/monitoring
  - libraries/redis
  - providers/idelis
  - providers/flowly
  - providers/gtfs
  - providers/hawk
  - providers/twisto
  - providers/rtm

allowBuilds:
  "@posthog/cli": true
  core-js: false
  esbuild: false
  protobufjs: false
  sharp: false

permissions:
  "@tanstack/react-router":
    skills: [router-query, migrate-from-react-router, react-router]
  "@tanstack/router-plugin":
    skills: true
  arktype:
    skills: true

skills:
  dirs:
    - .claude/skills
